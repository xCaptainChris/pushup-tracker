<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Progress Tracker</title>
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Pushup%20Tracker%22,%22short_name%22:%22Pushups%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#121212%22,%22theme_color%22:%22#121212%22}">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        /* Prevent selection highlighting but allow scrolling gestures on touch devices */
        body { background-color: #121212; color: #ffffff; padding: 15px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; -webkit-user-select: none; user-select: none; }
        
        /* Layout Structure */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .header h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }
        
        /* Interactive Date Badge Overlay Engine */
        .date-badge-wrapper { position: relative; display: inline-block; }
        .date-badge { background: #222; padding: 6px 12px; border-radius: 6px; font-size: 14px; color: #aaa; border: 1px solid #333; font-weight: bold; cursor: pointer; }
        .hidden-date-picker { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        .main-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 10px; -webkit-overflow-scrolling: touch; }
        
        /* Today's Totals Card */
        .card { background: #1a1a1a; border-radius: 12px; padding: 15px; border: 1px solid #262626; position: relative; }
        .card-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { font-size: 16px; font-weight: 700; color: #eee; }
        
        /* Sync Status Bar Container */
        .status-container { display: flex; align-items: center; gap: 8px; background: #222; padding: 4px 8px; border-radius: 20px; border: 1px solid #333; }
        .loading-status { font-size: 11px; color: #007aff; font-weight: bold; }
        .refresh-btn { background: none; border: none; color: #aaa; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; padding: 2px; }
        .refresh-btn:active { color: #007aff; }

        .chart-container { display: flex; justify-content: space-around; align-items: flex-end; height: 160px; padding-top: 10px; }
        .bar-wrapper { display: flex; flex-direction: column; align-items: center; width: 25%; height: 100%; justify-content: flex-end; }
        .bar-outer { background: #2d2d2d; width: 35px; height: 120px; border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; position: relative; }
        .bar-inner { background: #4cd964; width: 100%; height: 0%; transition: height 0.4s ease-out; }
        .bar-label { margin-top: 8px; font-size: 13px; color: #aaa; font-weight: 600; }
        .bar-count { font-size: 11px; color: #666; margin-bottom: 2px; position: absolute; width: 100%; text-align: center; bottom: 5px; font-weight: bold; color: #000; }

        /* Accordions */
        .accordion { background: #1a1a1a; border-radius: 12px; border: 1px solid #262626; overflow: hidden; }
        .accordion-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 15px; cursor: pointer; }
        .accordion-header::after { content: '▼'; font-size: 10px; color: #888; transition: transform 0.2s; }
        .accordion.open .accordion-header::after { transform: rotate(180deg); }
        
        /* FIXED: Removed max-height block restraints to allow natural layout extensions */
        .accordion-content { display: none; padding: 0 15px 15px 15px; overflow: hidden; font-size: 13px; color: #aaa; }
        .accordion.open .accordion-content { display: block; }
        .log-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #262626; }

        /* Anchored Input Panel */
        .input-panel { background: #1a1a1a; border-radius: 12px; padding: 15px; border: 1px solid #262626; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -4px 20px rgba(0,0,0,0.5); }
        .input-header { display: flex; justify-content: space-between; align-items: center; }
        .input-title { font-size: 15px; font-weight: 700; }
        
        .input-controls-right { display: flex; gap: 8px; align-items: center; }
        .panel-date-picker { background: #2d2d2d; color: white; border: 1px solid #333; padding: 4px 6px; border-radius: 6px; font-size: 12px; font-weight: 600; color-scheme: dark; }
        .user-select { background: #2d2d2d; color: white; border: 1px solid #333; padding: 4px 8px; border-radius: 6px; font-weight: 600; font-size: 13px; }
        
        .counter-grid { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 10px; align-items: center; }
        .counter-display { text-align: center; }
        .counter-number { font-size: 42px; font-weight: 800; line-height: 1; }
        .counter-unit { font-size: 11px; color: #888; font-weight: 700; letter-spacing: 1px; margin-top: 2px; }
        
        .btn-col { display: flex; flex-direction: column; gap: 8px; }
        .btn { background: #2d2d2d; color: white; border: 1px solid #3f3f3f; border-radius: 8px; padding: 12px; font-weight: 700; font-size: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .btn span { font-size: 9px; color: #888; font-weight: 500; margin-top: 1px; }
        .btn-neg { background: #262626; height: 100%; justify-content: center; font-size: 20px; }
        
        .manual-input-box { background: #121212; border: 1px solid #333; border-radius: 6px; padding: 6px; width: 100%; text-align: center; color: white; font-size: 14px; margin-top: 5px; }
        .submit-btn { background: #ffffff; color: #000000; border: none; border-radius: 8px; padding: 14px; font-weight: 800; font-size: 15px; text-align: center; width: 100%; margin-top: 5px; cursor: pointer; }
        .submit-btn:disabled { background: #555; color: #aaa; }
    </style>
</head>
<body>

    <div class="header">
        <h1>GLOBAL PROGRESS</h1>
        <div class="date-badge-wrapper">
            <div class="date-badge" id="today-date">Today</div>
            <input type="date" id="main-view-date-picker" class="hidden-date-picker" onchange="changeViewDate(this.value)">
        </div>
    </div>

    <div class="main-content">
        <div class="card">
            <div class="card-header-row">
                <div class="card-title" id="chart-card-title">Today's Totals</div>
                <div class="status-container">
                    <div class="loading-status" id="load-status">Syncing...</div>
                    <button class="refresh-btn" onclick="fetchDataFromSheet()" title="Force Refresh">🔄</button>
                </div>
            </div>
            <div class="chart-container">
                <div class="bar-wrapper">
                    <div class="bar-outer"><div class="bar-count" id="count-Anthony">0</div><div class="bar-inner" id="bar-Anthony"></div></div>
                    <div class="bar-label">Anthony</div>
                </div>
                <div class="bar-wrapper">
                    <div class="bar-outer"><div class="bar-count" id="count-Nick">0</div><div class="bar-inner" id="bar-Nick"></div></div>
                    <div class="bar-label">Nick</div>
                </div>
                <div class="bar-wrapper">
                    <div class="bar-outer"><div class="bar-count" id="count-Chris">0</div><div class="bar-inner" id="bar-Chris"></div></div>
                    <div class="bar-label">Chris</div>
                </div>
            </div>
        </div>

        <div class="accordion" id="history-accordion">
            <div class="accordion-header" id="log-accordion-header" onclick="toggleAccordion('history-accordion')">Detailed Daily Log</div>
            <div class="accordion-content" id="log-content">
                <div style="text-align:center; color:#555; padding: 10px;">Loading daily logs...</div>
            </div>
        </div>

        <div class="accordion" id="trends-accordion">
            <div class="accordion-header" onclick="toggleAccordion('trends-accordion')">Monthly Trends</div>
            <div class="accordion-content" id="trends-content">
                <div style="text-align:center; padding:10px; color:#aaa;">Monthly performance totals populate dynamically as records accumulate!</div>
            </div>
        </div>
    </div>

    <div class="input-panel">
        <div class="input-header">
            <div class="input-title">Add Pushups</div>
            <div class="input-controls-right">
                <input type="date" id="log-target-date" class="panel-date-picker">
                <select class="user-select" id="user-select">
                    <option value="Chris">Chris</option>
                    <option value="Anthony">Anthony</option>
                    <option value="Nick">Nick</option>
                </select>
            </div>
        </div>

        <div class="counter-grid">
            <div class="btn btn-neg" onclick="adjustCounter(-5)">-5<span>-5 REPS</span></div>
            
            <div class="counter-display">
                <div class="counter-number" id="counter-val">0</div>
                <div class="counter-unit">REPS</div>
                <input type="number" id="manual-input" class="manual-input-box" placeholder="Or type exact..." oninput="syncManualInput(this.value)">
            </div>
            
            <div class="btn-col">
                <div class="btn" onclick="adjustCounter(1)">+1<span>REPS</span></div>
                <div class="btn" onclick="adjustCounter(5)">+5<span>REPS</span></div>
                <div class="btn" onclick="adjustCounter(10)">+10<span>REPS</span></div>
            </div>
        </div>

        <button class="submit-btn" id="submit-btn" onclick="submitLog()">SAVE LOG ENTRY</button>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxxxrcbUtjxBVHJl_LaStWLn9fhnon0S79rewb1D1W_kMtQXbE7gjjWySoTtXVDmahO/exec"; 

        let currentCounter = 0;
        let masterSheetData = []; 
        let selectedViewDateStr = new Date().toDateString(); 
        const GOAL = 100;

        // Sync system calendar initialization default pointers safely
        const localISOString = new Date().toLocaleDateString('en-CA'); 
        document.getElementById('main-view-date-picker').value = localISOString;
        document.getElementById('log-target-date').value = localISOString;
        updateDateDisplayLabels(new Date());

        function adjustCounter(amount) {
            currentCounter += amount;
            updateCounterDisplay();
        }

        function syncManualInput(val) {
            if(val === "") return;
            currentCounter = parseInt(val) || 0;
            document.getElementById('counter-val').innerText = currentCounter;
        }

        function updateCounterDisplay() {
            document.getElementById('counter-val').innerText = currentCounter;
            document.getElementById('manual-input').value = currentCounter === 0 ? "" : currentCounter;
        }

        function toggleAccordion(id) {
            document.getElementById(id).classList.toggle('open');
        }

        function updateDateDisplayLabels(dateObj) {
            const formatted = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const isToday = dateObj.toDateString() === new Date().toDateString();
            
            document.getElementById('today-date').innerText = isToday ? `Today (${formatted})` : formatted;
            document.getElementById('chart-card-title').innerText = isToday ? "Today's Totals" : `${formatted} Totals`;
            document.getElementById('log-accordion-header').innerText = isToday ? "Detailed Daily Log" : `Logs for ${formatted}`;
        }

        function changeViewDate(dateValue) {
            if(!dateValue) return;
            const targetDate = new Date(dateValue + "T12:00:00"); 
            selectedViewDateStr = targetDate.toDateString();
            updateDateDisplayLabels(targetDate);
            processAndRenderData();
        }

        function processAndRenderData() {
            let dailyData = { Anthony: 0, Nick: 0, Chris: 0 };
            let filteredLogs = [];
            let monthlyTotals = { Anthony: 0, Nick: 0, Chris: 0 };
            
            const currentViewObj = new Date(selectedViewDateStr);
            const viewMonth = currentViewObj.getMonth();
            const viewYear = currentViewObj.getFullYear();

            masterSheetData.forEach(item => {
                if(!item.timestamp) return;
                const entryDate = new Date(item.timestamp);
                
                // Aggregate monthly trend analytics counters
                if(entryDate.getMonth() === viewMonth && entryDate.getFullYear() === viewYear) {
                    if(monthlyTotals.hasOwnProperty(item.name)) {
                        monthlyTotals[item.name] += item.reps;
                    }
                }

                // Filter items matching active targeted dashboard date
                if(entryDate.toDateString() === selectedViewDateStr) {
                    if(dailyData.hasOwnProperty(item.name)) {
                        dailyData[item.name] += item.reps;
                    }
                    const timeString = entryDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    filteredLogs.push({ name: item.name, reps: item.reps, time: timeString });
                }
            });

            // Re-render Bar Graph UI Visuals
            ['Anthony', 'Nick', 'Chris'].forEach(user => {
                const total = dailyData[user];
                document.getElementById(`count-${user}`).innerText = total;
                const percentage = Math.min((total / GOAL) * 100, 100);
                document.getElementById(`bar-${user}`).style.height = `${Math.max(percentage, 0)}%`;
            });

            // Re-render Detailed History Rows
            const container = document.getElementById('log-content');
            if (filteredLogs.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#555; padding: 10px;">No entries logged for this date.</div>';
            } else {
                container.innerHTML = filteredLogs.map(log => `
                    <div class="log-item">
                        <strong>${log.name}</strong>
                        <span>${log.reps > 0 ? '+' : ''}${log.reps} reps <small style="color:#555;margin-left:5px;">${log.time}</small></span>
                    </div>
                `).join('');
            }

            // Build Monthly Trends Panel text
            const monthLabel = currentViewObj.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            document.getElementById('trends-content').innerHTML = `
                <div style="font-weight: bold; margin-bottom: 8px; color: #eee; border-bottom: 1px solid #333; padding-bottom: 5px;">${monthLabel} Total Collection</div>
                <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 5px;">
                    <div style="display:flex; justify-content:space-between;"><span>Anthony:</span><strong>${monthlyTotals.Anthony} reps</strong></div>
                    <div style="display:flex; justify-content:space-between;"><span>Nick:</span><strong>${monthlyTotals.Nick} reps</strong></div>
                    <div style="display:flex; justify-content:space-between;"><span>Chris:</span><strong>${monthlyTotals.Chris} reps</strong></div>
                </div>
            `;
        }

        function fetchDataFromSheet() {
            document.getElementById('load-status').innerText = "Syncing...";
            
            fetch(GOOGLE_SCRIPT_URL)
                .then(response => response.json())
                .then(data => {
                    masterSheetData = Array.isArray(data) ? data : [];
                    processAndRenderData();
                    document.getElementById('load-status').innerText = "Online";
                })
                .catch(err => {
                    console.error("Error reading from spreadsheet:", err);
                    document.getElementById('load-status').innerText = "Offline Mode";
                });
        }

        function submitLog() {
            const selectedUser = document.getElementById('user-select').value;
            const repsToLog = currentCounter;
            const chosenDateVal = document.getElementById('log-target-date').value;

            if (repsToLog === 0) return;

            let targetTimestamp = new Date();
            if(chosenDateVal !== new Date().toLocaleDateString('en-CA')) {
                targetTimestamp = new Date(chosenDateVal + "T12:00:00");
            }

            masterSheetData.unshift({
                name: selectedUser,
                reps: repsToLog,
                timestamp: targetTimestamp.toISOString()
            });

            if(targetTimestamp.toDateString() !== selectedViewDateStr) {
                selectedViewDateStr = targetTimestamp.toDateString();
                document.getElementById('main-view-date-picker').value = chosenDateVal;
                updateDateDisplayLabels(targetTimestamp);
            }

            processAndRenderData();
            
            currentCounter = 0;
            updateCounterDisplay();

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            document.getElementById('load-status').innerText = "Saving...";
            
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: selectedUser, reps: repsToLog, timestamp: targetTimestamp.toISOString() })
            }).then(() => {
                btn.disabled = false;
                document.getElementById('load-status').innerText = "Online";
                setTimeout(fetchDataFromSheet, 1200);
            }).catch(err => {
                console.error("Sheet sync error: ", err);
                btn.disabled = false;
                document.getElementById('load-status').innerText = "Sync Error";
            });
        }

        fetchDataFromSheet();
    </script>
</body>
</html>
